<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Poem Generator</title>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Poem Generator</h1>
      </header>
      <form id="poem-generator-form">
        <input
          type="text"
          placeholder="Poem topic"
          autofocus
          autocomplete="off"
          required
          class="form-text-input"
        />
        <input type="submit" class="submit-button" />
      </form>
      <div id="poem">
        Of morning light the rivers sing, <br />
        Soft winds awaken everything, <br />
        And quiet hope begins to ring.
      </div>
      <footer>
        This project was coded by
        <a href="https://github.com/samanthabh" target="_blank"
          >Samantha Burfield-Haar</a
        >, is
        <a
          href="https://github.com/samanthabh/ai-poem-generator"
          target="_blank"
          >open-sourced on Github</a
        >
        and deployed on
        <a href="https://sbh-ai-poem-generator.netlify.app/" target="_blank"
          >Netlify</a
        >.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
